<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Scanner</title>
 
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
margin: 0;
padding: 15px;
background: #f2f2f7;
}
 
.container {
max-width: 800px;
margin: auto;
}
 
.card {
background: white;
border-radius: 12px;
padding: 16px;
margin-bottom: 12px;
}
 
h1 {
margin-top: 0;
}
 
button {
width: 100%;
padding: 14px;
margin-top: 8px;
font-size: 16px;
border: none;
border-radius: 10px;
cursor: pointer;
}
 
.start {
background: #007aff;
color: white;
}
 
.export {
background: #34c759;
color: white;
}
 
.clear {
background: #ff3b30;
color: white;
}
 
#reader {
width: 100%;
}
 
.scan {
padding: 8px;
border-bottom: 1px solid #ddd;
word-break: break-all;
}
 
.count {
font-weight: bold;
margin-bottom: 10px;
}
 
.status {
margin-top: 10px;
color: #666;
}
</style>
 
<script src="https://unpkg.com/html5-qrcoded>
<body>
 
<div class="container">
 
<div class="card">
<h1>Barcode Scanner</h1>
 
<div id="reader"></div>
 
<button class="start" onclick="startScanning()">
Start Scanner
</button>
 
<button class="export" onclick="exportCSV()">
Export CSV
</button>
 
<button class="clear" onclick="clearScans()">
Clear Scans
</button>
 
<div class="status" id="status">
Ready
</div>
</div>
 
<div class="card">
<div class="count">
Total Scans:
<span id="count">0</span>
</div>
 
<div id="scanList"></div>
</div>
 
</div>
 
<script>
const STORAGE_KEY = "barcode_scans";
 
let scans = JSON.parse(
localStorage.getItem(STORAGE_KEY) || "[]"
);
 
let scanner = null;
let lastScan = "";
let lastTime = 0;
 
function saveScans() {
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(scans)
);
}
 
function refreshDisplay() {
 
document.getElementById("count").textContent =
scans.length;
 
document.getElementById("scanList").innerHTML =
scans.slice().reverse().map(code =>
`<div class="scan">${code}</div>`
).join("");
}
 
refreshDisplay();
 
function addScan(code) {
 
const now = Date.now();
 
if (
code === lastScan &&
now - lastTime < 1500
) {
return;
}
 
lastScan = code;
lastTime = now;
 
scans.push(code);
 
saveScans();
refreshDisplay();
 
document.getElementById("status").textContent =
"Last scan: " + code;
 
if (navigator.vibrate) {
navigator.vibrate(100);
}
}
 
async function startScanning() {
 
if (scanner) {
return;
}
 
scanner = new Html5Qrcode("reader");
 
try {
 
const cameras =
await Html5Qrcode.getCameras();
 
if (!cameras.length) {
throw new Error("No camera found");
}
 
const rearCamera =
cameras[cameras.length - 1].id;
 
await scanner.start(
rearCamera,
{
fps: 10,
qrbox: { width: 250, height: 250 }
},
decodedText => addScan(decodedText)
);
 
document.getElementById("status").textContent =
"Scanner running";
 
} catch (e) {
 
document.getElementById("status").textContent =
e.message;
}
}
 
function exportCSV() {
 
let csv = "Barcode\n";
 
scans.forEach(code => {
csv += `"${code.replaceAll('"', '""')}"\n`;
});
 
const blob = new Blob(
[csv],
{
type: "text/csv;charset=utf-8"
}
);
 
const url =
URL.createObjectURL(blob);
 
const a = document.createElement("a");
 
a.href = url;
a.download = "barcodes.csv";
 
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
 
URL.revokeObjectURL(url);
}
 
function clearScans() {
 
if (!confirm("Delete all scans?")) {
return;
}
 
scans = [];
 
saveScans();
refreshDisplay();
 
document.getElementById("status").textContent =
"Scans cleared";
}
</script>
 
</body>
</html>
