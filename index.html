<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>Barcode Scanner</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --panel: #121a2b;
    --panel-2: #182238;
    --text: #eaf0ff;
    --muted: #9aa8c7;
    --accent: #2f81f7;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --border: #26314a;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  input {
    -webkit-user-select: auto;
    user-select: auto;
  }

  body {
    padding-bottom: env(safe-area-inset-bottom);
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 18, 32, 0.94);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 8px) 10px 10px;
  }

  .toolbar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .version {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 7px;
  }

  .app-title {
    font-size: 13px;
    font-weight: 800;
  }

  .metadata-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }

  .metadata-input {
    min-width: 0;
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0e1626;
    color: var(--text);
    font-size: 14px;
    padding: 0 10px;
  }

  .metadata-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .counter {
    min-width: 58px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 5px 6px;
  }

  .counter-value {
    display: block;
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
  }

  .counter-label {
    display: block;
    margin-top: 2px;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .toolbar-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    flex: 1;
  }

  .button {
    appearance: none;
    border: 0;
    border-radius: 12px;
    min-height: 44px;
    padding: 8px;
    font-size: 13px;
    font-weight: 700;
    color: white;
    background: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }

  .button:active {
    transform: scale(0.98);
  }

  .button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .button.secondary { background: #334155; }
  .button.danger { background: #7f1d1d; }
  .button.success { background: var(--success); }
  .button.ocr { background: #7c3aed; }
  .button.undo { background: #475569; }

  .status {
    margin-top: 7px;
    min-height: 18px;
    font-size: 12px;
    line-height: 1.3;
    color: var(--muted);
    text-align: center;
  }

  .status.error { color: #fca5a5; font-weight: 600; }
  .status.success { color: #86efac; font-weight: 700; }
  .status.warning { color: #fcd34d; font-weight: 700; }

  main {
    padding: 10px;
    max-width: 720px;
    margin: 0 auto;
  }

  .manual-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    margin-bottom: 10px;
  }

  .manual-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .manual-input {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0e1626;
    color: var(--text);
    font-size: 16px;
    padding: 0 10px;
  }

  .manual-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .ocr-choices {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .ocr-choices.visible {
    display: flex;
  }

  .ocr-choice {
    appearance: none;
    border: 1px solid #7c3aed;
    background: #2e1065;
    color: white;
    border-radius: 999px;
    min-height: 36px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 800;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: pointer;
  }

  .camera-card {
    position: relative;
    background: black;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  #camera {
    width: 100%;
    height: 34vh;
    min-height: 210px;
    max-height: 300px;
    background: black;
    display: block;
    object-fit: cover;
  }

  #freezeFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    pointer-events: none;
  }

  #freezeFrame.visible { display: block; }

  .camera-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    text-align: center;
    padding: 16px;
    font-size: 15px;
    font-weight: 600;
  }

  .camera-overlay.visible { display: flex; }

  .scan-flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(34, 197, 94, 0.32);
    border: 4px solid var(--success);
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .scan-flash.active { opacity: 1; }

  .scan-flash.bad {
    background: rgba(239, 68, 68, 0.32);
    border-color: var(--danger);
  }

  .scan-guide {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }

  .scan-guide.visible { display: block; }

  .scan-guide::before {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    top: 50%;
    height: 2px;
    background: rgba(34, 197, 94, 0.75);
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
  }

  .scan-guide::after {
    content: "";
    position: absolute;
    top: 18%;
    bottom: 18%;
    left: 50%;
    width: 2px;
    background: rgba(34, 197, 94, 0.35);
  }

  .camera-side-controls {
