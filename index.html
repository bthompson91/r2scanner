<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>Barcode Scanner v0.26</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121a2b;--panel2:#182238;--text:#eaf0ff;--muted:#9aa8c7;--accent:#2f81f7;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--border:#26314a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:auto;user-select:auto}
body{padding-bottom:env(safe-area-inset-bottom)}
.toolbar{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 8px) 10px 10px}
.toolbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.version{font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:2px 7px}
.app-title{font-size:13px;font-weight:800}
#cacheButton{min-width:38px;min-height:38px;font-size:14px}
.metadata-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.metadata-input{min-width:0;min-height:40px;border:1px solid var(--border);border-radius:12px;background:#0e1626;color:var(--text);font-size:14px;padding:0 10px}
.metadata-input:focus{outline:none;border-color:var(--accent)}
.toolbar-row{display:flex;align-items:center;gap:6px}
.counter{min-width:58px;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px 6px}
.counter-value{display:block;font-size:20px;font-weight:800;line-height:1}
.counter-label{display:block;margin-top:2px;font-size:8px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.toolbar-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:1}
.button{appearance:none;border:0;border-radius:12px;min-height:44px;padding:8px;font-size:13px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;white-space:nowrap}
.button:active{transform:scale(.98)}
.button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#334155}
.danger{background:#7f1d1d}
.success{background:var(--success)}
.ocr{background:#7c3aed}
.undo{background:#475569}
.status{margin-top:7px;min-height:18px;font-size:12px;color:var(--muted);text-align:center}
.status.error{color:#fca5a5;font-weight:600}
.status.success{color:#86efac;font-weight:700}
.status.warning{color:#fcd34d;font-weight:700}
main{padding:10px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px;margin-bottom:10px}
.manual-row{display:flex;gap:6px}
.manual-input{flex:1;min-width:0;min-height:44px;border:1px solid var(--border);border-radius:12px;background:#0e1626;color:var(--text);font-size:15px;padding:0 10px;text-transform:uppercase}
.manual-input:focus{outline:none;border-color:var(--accent)}
.ocr-choices{display:none;flex-wrap:wrap;gap:6px;margin-top:8px}
.ocr-choices.visible{display:flex}
.ocr-choice{border:1px solid var(--accent);background:rgba(47,129,247,.16);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.camera-card{position:relative;background:#000;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px;aspect-ratio:4/3;max-height:46vh;width:100%}
.camera-card video,.camera-card canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camera-card video{z-index:1}
.camera-card canvas{z-index:2;opacity:0;pointer-events:none}
.camera-card canvas.visible{opacity:1}
.camera-overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:13px;background:rgba(11,18,32,.72)}
.camera-overlay.visible{display:flex}
.scan-flash{position:absolute;inset:0;z-index:6;background:rgba(34,197,94,.28);border:2px solid var(--success);opacity:0;transition:opacity .12s;pointer-events:none}
.scan-flash.active{opacity:1}
.scan-flash.bad{background:rgba(239,68,68,.32);border-color:var(--danger)}
.scan-guide{position:absolute;inset:0;z-index:4;pointer-events:none}
.scan-guide::before{content:"";position:absolute;left:7%;right:7%;top:40%;height:20%;border:3px solid rgba(34,197,94,.8);border-radius:14px}
.scan-guide.qr::before{left:22%;right:22%;top:20%;bottom:20%;height:auto;border-radius:18px}
.scan-guide.hidden{display:none}
.camera-card::after{content:"";position:absolute;inset:0;border:3px solid transparent;border-radius:inherit;pointer-events:none;z-index:7}
.camera-card.scanning::after{border-color:rgba(34,197,94,.55);animation:scanPulse 1.7s ease-in-out infinite}
.camera-card.found::after{border-color:#f59e0b}
.camera-card.success::after{border-color:#22c55e}
.camera-card.error::after{border-color:#ef4444}
@keyframes scanPulse{0%,100%{opacity:.4}50%{opacity:1}}
.side-controls{position:absolute;top:10px;z-index:8;display:flex;flex-direction:column;gap:6px}
.side-controls.left{left:10px}
.side-controls.right{right:10px}
.camera-control{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(15,23,42,.78);color:#fff;border-radius:12px;min-width:46px;min-height:38px;padding:5px 7px;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.camera-control:disabled{opacity:.4;cursor:not-allowed}
.camera-control.torch-on{background:rgba(245,158,11,.9);color:#1f1300;border-color:rgba(245,158,11,.9)}
.camera-control.active{border-color:var(--accent);background:rgba(47,129,247,.75)}
.camera-control.hard{background:#b45309;font-size:10px}
.camera-control.rot{background:#334155}
.camera-card.rot-90 video,.camera-card.rot-90 canvas{transform:rotate(90deg)}
.camera-card.rot-180 video,.camera-card.rot-180 canvas{transform:rotate(180deg)}
.camera-card.rot-270 video,.camera-card.rot-270 canvas{transform:rotate(270deg)}
.zoom-value{font-size:10px;color:var(--muted);text-align:center;min-height:12px}
.hint{margin:-4px 0 10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:11px;line-height:1.35}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 6px;font-size:13px;font-weight:800}
.search-row{display:flex;gap:6px;margin-bottom:8px}
.search-input{flex:1;min-width:0;min-height:40px;border:1px solid var(--border);border-radius:12px;background:#0e1626;color:var(--text);font-size:15px;padding:0 10px}
.search-input:focus{outline:none;border-color:var(--accent)}
.scan-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.scan-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.scan-details{flex:1;min-width:0}
.scan-code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;word-break:break-all}
.scan-time{color:var(--muted);font-size:10px}
.scan-actions{display:flex;gap:5px}
.icon-button{appearance:none;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;min-width:34px;min-height:34px;font-size:12px;font-weight:800}
.empty{display:none;color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:20px}
.modal.visible{display:flex}
.modal-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.modal-title{margin:0 0 12px;font-size:16px;text-align:center}
.modal-actions{display:flex;gap:8px;justify-content:center}
.modal-actions .button{flex:1}
.confirm-code{font-size:30px;font-weight:800;text-align:center;letter-spacing:.04em;margin:10px 0 16px;word-break:break-all}
</style>
</head>
<body>

<header class="toolbar">
  <div class="toolbar-top">
    <span class="version">v0.26</span>
    <span class="app-title">Barcode Scanner</span>
    <button class="icon-button" id="cacheButton" type="button" title="Refresh page cache">⟳</button>
  </div>

  <div class="metadata-row">
    <input class="metadata-input" id="venueInput" type="text" placeholder="Venue" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" aria-label="Venue">
    <input class="metadata-input" id="transferInput" type="text" placeholder="Transfer" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" aria-label="Transfer">
  </div>

  <div class="toolbar-row">
    <div class="counter">
      <span class="counter-value" id="scanCount">0</span>
      <span class="counter-label">Scans</span>
    </div>

    <div class="toolbar-buttons">
      <button class="button success" id="startButton" type="button">Start</button>
      <button class="button" id="exportButton" type="button" disabled>Share</button>
      <button class="button danger" id="clearButton" type="button" disabled>Clear</button>
    </div>
  </div>

  <div class="status" id="status">Loading…</div>
</header>

<main>
  <section class="card">
    <div class="manual-row">
      <input class="manual-input" id="manualInput" type="text" inputmode="numeric" placeholder="12345 → R00012345" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Enter Asset ID digits; R prefix and zero padding are added automatically">
      <button class="button success" id="addManualButton" type="button">Add</button>
      <button class="button ocr" id="ocrButton" type="button">OCR</button>
    </div>

    <div class="ocr-choices" id="ocrChoices"></div>

    <input id="ocrFileInput" type="file" accept="image/*" capture="environment" style="display:none">
  </section>

  <section class="camera-card" id="cameraCard">
    <video id="camera" playsinline muted autoplay></video>
    <canvas id="freezeFrame"></canvas>
    <div class="camera-overlay visible" id="cameraOverlay">Camera preview will appear here</div>
    <div class="scan-flash" id="scanFlash"></div>
    <div class="scan-guide" id="scanGuide"></div>

    <div class="side-controls left">
      <button class="camera-control" id="cameraButton" type="button" disabled>CAM</button>
      <button class="camera-control" id="torchButton" type="button" disabled>⚡</button>
      <button class="camera-control rot" id="rotButton" type="button">⟳</button>
      <button class="camera-control active" id="guideButton" type="button">⊞</button>
    </div>

    <div class="side-controls right">
      <button class="camera-control hard" id="hardButton" type="button">TRY</button>
      <button class="camera-control" id="zoomInButton" type="button" disabled>＋</button>
      <div class="zoom-value" id="zoomValue"></div>
      <button class="camera-control" id="zoomOutButton" type="button" disabled>－</button>
    </div>
  </section>

  <div class="hint">
    Aim the barcode at the green band. Tap the preview or press TRY for a harder multi-angle scan. Use OCR for a damaged label.
  </div>

  <section>
    <div class="section-title">
      <span>Scanned Barcodes</span>
      <button class="button undo" id="undoButton" type="button" disabled>Undo</button>
    </div>

    <div class="search-row">
      <input class="search-input" id="searchInput" type="search" placeholder="Search scanned Asset IDs" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Search scanned Asset IDs">
    </div>

    <ul class="scan-list" id="scanList"></ul>
    <div class="empty" id="emptyState">No barcodes scanned yet.</div>
  </section>
</main>

<div class="modal" id="confirmModal">
  <div class="modal-card">
    <h2 class="modal-title">Add this scan?</h2>
    <div class="confirm-code" id="confirmCode"></div>
    <div class="modal-actions">
      <button class="button secondary" id="confirmNoButton" type="button">No</button>
      <button class="button success" id="confirmYesButton" type="button">Yes</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"></script>

<script type="module">
import { readBarcodesFromImageData } from "https://cdn.jsdelivr.net/npm/zxing-wasm@1.3.4/+esm";

const APP_VERSION = "v0.26";
const STORAGE_KEY = "barcode-scanner-scans-v1";
const METADATA_KEY = "barcode-scanner-metadata-v1";
const DUP_MS = 1500;

const $ = id => document.getElementById(id);

const startButton = $("startButton");
const exportButton = $("exportButton");
const clearButton = $("clearButton");
const undoButton = $("undoButton");
const statusEl = $("status");
const countEl = $("scanCount");
const listEl = $("scanList");
const emptyEl = $("emptyState");
const overlayEl = $("cameraOverlay");
const flashEl = $("scanFlash");
const guideEl = $("scanGuide");
const freezeEl = $("freezeFrame");
const videoEl = $("camera");
const cameraCard = $("cameraCard");
const cameraButton = $("cameraButton");
const torchButton = $("torchButton");
const guideButton = $("guideButton");
const hardButton = $("hardButton");
const rotButton = $("rotButton");
const zoomInButton = $("zoomInButton");
const zoomOutButton = $("zoomOutButton");
const zoomValue = $("zoomValue");
const venueEl = $("venueInput");
const transferEl = $("transferInput");
const manualEl = $("manualInput");
const addButton = $("addManualButton");
const ocrButton = $("ocrButton");
const fileInput = $("ocrFileInput");
const choicesEl = $("ocrChoices");
const searchEl = $("searchInput");
const confirmModal = $("confirmModal");
const confirmCode = $("confirmCode");
const confirmYes = $("confirmYesButton");
const confirmNo = $("confirmNoButton");

let stream = null;
let track = null;
let devices = [];
let deviceId = null;
let cameraOn = false;
let torchOn = false;
let zoom = 1;
let zoomCaps = null;
let viewRotation = 0;
let scanTimer = null;
let busy = false;
let ocrBusy = false;
let ocrWorker = null;
let lastScan = { text: null, time: 0 };
let lastGoodScan = 0;
let lastAction = null;
let editing = null;
let reminder = null;
let goodAudio = null;
let badAudio = null;
let scanDb = null;

let scans = loadScans();
let meta = loadMetadata();

window.onerror = message => setStatus("App error: " + message, "error");

function loadScans() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter(x => x && typeof x.barcode === "string" && typeof x.timestamp === "number") : [];
  } catch {
    return [];
  }
}

function loadMetadata() {
  try {
    const parsed = JSON.parse(localStorage.getItem(METADATA_KEY) || "{}");
    return { venue: parsed.venue || "", transfer: parsed.transfer || "" };
  } catch {
    return { venue: "", transfer: "" };
  }
}

function saveMetadata() {
  localStorage.setItem(METADATA_KEY, JSON.stringify(meta));
}

function openScanDb() {
  return new Promise((resolve, reject) => {
    if (scanDb) return resolve(scanDb);
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));

    const request = indexedDB.open("barcode-scanner", 1);

    request.onupgradeneeded = event => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains("scans")) {
        db.createObjectStore("scans", { keyPath: "timestamp" });
      }
    };

    request.onsuccess = event => {
      scanDb = event.target.result;
      resolve(scanDb);
    };

    request.onerror = () => reject(request.error);
  });
}

function idbReplaceAll(records) {
  return openScanDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("scans", "readwrite");
    const store = tx.objectStore("scans");
    store.clear();
    records.forEach(record => store.put({ barcode: record.barcode, timestamp: record.timestamp }));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  })).catch(() => {});
}

function idbHydrate() {
  return openScanDb().then(db => new Promise((resolve, reject) => {
    const request = db.transaction("scans", "readonly").objectStore("scans").getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  })).then(records => {
    const known = new Set(scans.map(x => x.barcode));
    const merged = scans.slice();

    records.forEach(record => {
      if (!record?.barcode || known.has(record.barcode)) return;
      known.add(record.barcode);
      merged.push({ barcode: record.barcode, timestamp: record.timestamp });
    });

    merged.sort((a, b) => b.timestamp - a.timestamp);

    if (merged.length !== scans.length) {
      scans = merged;
      saveScans();
      updateUi();
    }
  }).catch(() => {});
}

function saveScans() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scans));
  } catch {
    setStatus("Could not save scans locally.", "error");
  }

  idbReplaceAll(scans);
}

function setStatus(message, type) {
  statusEl.textContent = message;
  statusEl.className = "status";
  if (type) statusEl.classList.add(type);
}

function findIndex(barcode) {
  return scans.findIndex(scan => scan.barcode === barcode);
}

function updateUi() {
  countEl.textContent = String(scans.length);
  listEl.innerHTML = "";
  undoButton.disabled = !lastAction;

  if (!scans.length) {
    emptyEl.style.display = "block";
    exportButton.disabled = true;
    clearButton.disabled = true;
    return;
  }

  emptyEl.style.display = "none";
  exportButton.disabled = false;
  clearButton.disabled = false;

  const term = searchEl.value.trim().toUpperCase();
  let shown = 0;

  scans.forEach((scan, index) => {
    if (term && !scan.barcode.includes(term)) return;
    shown++;

    const li = document.createElement("li");
    li.className = "scan-item";

    const details = document.createElement("div");
    details.className = "scan-details";

    const code = document.createElement("div");
    code.className = "scan-code";
    code.textContent = scan.barcode;

    const time = document.createElement("div");
    time.className = "scan-time";
    time.textContent = new Date(scan.timestamp).toLocaleTimeString();

    details.append(code, time);

    const actions = document.createElement("div");
    actions.className = "scan-actions";

    const edit = document.createElement("button");
    edit.className = "icon-button";
    edit.type = "button";
    edit.textContent = "✎";
    edit.addEventListener("click", () => {
      editing = index;
      updateUi();
    });

    const remove = document.createElement("button");
    remove.className = "icon-button";
    remove.type = "button";
    remove.textContent = "✕";
    remove.addEventListener("click", () => {
      lastAction = { type: "remove", scan: scans[index], index };
      scans.splice(index, 1);
      editing = null;
      saveScans();
      updateUi();
      setStatus("Removed " + scan.barcode, "warning");
    });

    actions.append(edit, remove);
    li.append(details, actions);
    listEl.appendChild(li);
  });

  if (!shown) {
    emptyEl.style.display = "block";
    emptyEl.textContent = "No matching scans.";
  }
}

function addScan(barcode, source) {
  const clean = String(barcode || "").trim().toUpperCase();
  if (!clean) return false;

  const now = Date.now();

  if (lastScan.text === clean && now - lastScan.time < DUP_MS) return false;

  if (findIndex(clean) !== -1) {
    lastScan = { text: clean, time: now };
    badSound();
    vibrate([120, 70, 120]);
    badFlash();
    setScanState("error");
    setStatus("Already scanned: " + clean, "warning");
    return false;
  }

  lastScan = { text: clean, time: now };
  lastGoodScan = now;

  scans.unshift({ barcode: clean, timestamp: now });
  editing = null;
  lastAction = { type: "add", barcode: clean };

  saveScans();
  updateUi();
  goodSound();
  vibrate(80);
  goodFlash();
  setScanState("success");
  freeze();

  setStatus((source === "ocr" ? "OCR added: " : "Added: ") + clean, "success");
  return true;
}

function undo() {
  if (!lastAction) return;

  if (lastAction.type === "add") {
    const index = findIndex(lastAction.barcode);
    if (index !== -1) {
      lastAction = { type: "remove", scan: scans[index], index };
      scans.splice(index, 1);
    }
  } else {
    scans.splice(Math.min(lastAction.index, scans.length), 0, lastAction.scan);
    lastAction = { type: "add", barcode: lastAction.scan.barcode };
  }

  editing = null;
  saveScans();
  updateUi();
  setStatus("Undone.", "success");
}

function setScanState(state) {
  cameraCard.classList.remove("found", "success", "error");
  if (state) cameraCard.classList.add(state);
}

function showConfirm(text) {
  pendingScan = String(text).trim();
  confirmCode.textContent = pendingScan;
  confirmModal.classList.add("visible");
  busy = true;
  setScanState("found");
  setTimeout(() => confirmYes.focus(), 50);
}

function closeConfirm(accepted) {
  confirmModal.classList.remove("visible");
  busy = false;

  const text = pendingScan;
  pendingScan = null;

  if (!text) return;

  const clean = text.trim().toUpperCase();

  if (accepted) {
    if (!addScan(clean, "camera")) setScanState("error");
    return;
  }

  lastScan = { text: clean, time: Date.now() };
  setScanState(null);
  setStatus("Scan cancelled: " + clean, "warning");
}

function grabFrame() {
  const width = videoEl.videoWidth;
  const height = videoEl.videoHeight;
  if (!width || !height) return null;

  const canvas = document.createElement("canvas");
  const swap = viewRotation === 90 || viewRotation === 270;

  canvas.width = swap ? height : width;
  canvas.height = swap ? width : height;

  const context = canvas.getContext("2d", { willReadFrequently: true });
  context.save();
  context.translate(canvas.width / 2, canvas.height / 2);
  context.rotate(viewRotation * Math.PI / 180);
  context.drawImage(videoEl, -width / 2, -height / 2, width, height);
  context.restore();

  return canvas;
}

function rotatedCanvas(source, degrees) {
  if (!degrees) return source;

  const swap = degrees === 90 || degrees === 270;
  const canvas = document.createElement("canvas");

  canvas.width = swap ? source.height : source.width;
  canvas.height = swap ? source.width : source.height;

  const context = canvas.getContext("2d", { willReadFrequently: true });
  context.translate(canvas.width / 2, canvas.height / 2);
  context.rotate(degrees * Math.PI / 180);
  context.drawImage(source, -source.width / 2, -source.height / 2);

  return canvas;
}

async function decodeCanvas(canvas) {
  const context = canvas.getContext("2d", { willReadFrequently: true });
  const imageData = context.getImageData(0, 0, canvas.width, canvas.height);

  try {
    const zxingResults = await readBarcodesFromImageData(imageData, {
      tryHarder: true,
      formats: ["Code39", "Code128", "EAN13", "EAN8", "UPCA", "UPCE", "QRCode"]
    });

    if (zxingResults.length) {
      return { text: zxingResults[0].text, format: zxingResults[0].format, engine: "ZXing" };
    }
  } catch {
    // Fall through to ZBar.
  }

  try {
    const symbols = await zbarWasm.scanImageData(imageData);

    if (symbols.length) {
      return { text: symbols[0].decode(), format: symbols[0].typeName, engine: "ZBar" };
    }
  } catch {
    // No result.
  }

  return null;
}

function scanFrame() {
  if (!cameraOn || busy) return;

  const source = grabFrame();
  if (!source) return;

  decodeCanvas(source).then(result => {
    if (!result || busy) return;

    guideEl.classList.toggle("qr", String(result.format).toLowerCase().includes("qr"));
    showConfirm(result.text);
  });
}

function startScanLoop() {
  stopScanLoop();
  cameraCard.classList.add("scanning");
  scanTimer = setInterval(scanFrame, 140);
}

function stopScanLoop() {
  if (scanTimer) {
    clearInterval(scanTimer);
    scanTimer = null;
  }
  cameraCard.classList.remove("scanning", "found", "success", "error");
}

async function forceScan() {
  if (!cameraOn) {
    setStatus("Start the camera first.", "error");
    return;
  }

  if (busy) return;

  busy = true;
  hardButton.disabled = true;
  setStatus("Trying harder…");

  const frames = [];

  for (let i = 0; i < 5 && frames.length < 5; i++) {
    const frame = grabFrame();
    if (frame) frames.push(frame);
    await new Promise(resolve => setTimeout(resolve, 110));
  }

  const variants = [];

  frames.forEach(frame => {
    variants.push(frame);
    [90, 180, 270].forEach(angle => variants.push(rotatedCanvas(frame, angle)));
  });

  let found = null;

  for (const canvas of variants) {
    const result = await decodeCanvas(canvas);

    if (result?.text) {
      found = result;
      break;
    }
  }

  busy = false;
  hardButton.disabled = false;

  if (found) {
    guideEl.classList.toggle("qr", String(found.format).toLowerCase().includes("qr"));
    showConfirm(found.text);
    return;
  }

  badSound();
  vibrate([120, 70, 120]);
  badFlash();
  setScanState("error");
  setStatus("No barcode found. Try zoom, flash, another angle, or OCR.", "warning");
}

function getTrack() {
  return stream?.getVideoTracks()?.[0] || null;
}

async function setupControls() {
  track = getTrack();
  if (!track) return;

  try {
    await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
  } catch {}

  let caps = null;
  try { caps = track.getCapabilities?.() || null; } catch {}

  torchButton.disabled = !(caps?.torch);

  if (caps?.zoom && typeof caps.zoom.min === "number") {
    zoomCaps = { min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1 };
    zoom = zoomCaps.min;
  } else {
    zoomCaps = null;
    zoom = 1;
  }

  updateZoomButtons();

  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(device => device.kind === "videoinput");

    const settings = track.getSettings?.();
    if (settings?.deviceId) deviceId = settings.deviceId;

    cameraButton.disabled = devices.length < 2;
  } catch {
    devices = [];
    cameraButton.disabled = true;
  }
}

function updateZoomButtons() {
  if (!zoomCaps) {
    zoomInButton.disabled = true;
    zoomOutButton.disabled = true;
    zoomValue.textContent = "";
    return;
  }

  zoomOutButton.disabled = zoom <= zoomCaps.min + 0.001;
  zoomInButton.disabled = zoom >= zoomCaps.max - 0.001;
  zoomValue.textContent = zoom.toFixed(1) + "×";
}

async function setZoom(value) {
  if (!track || !zoomCaps) return;

  const next = Math.min(zoomCaps.max, Math.max(zoomCaps.min, Number(value)));

  try {
    await track.applyConstraints({ advanced: [{ zoom: next }] });
    zoom = next;
    updateZoomButtons();
  } catch {
    setStatus("Zoom is not supported at this level.", "error");
  }
}

async function toggleTorch() {
  if (!cameraOn) {
    setStatus("Start the camera first.", "error");
    return;
  }

  if (!track) track = getTrack();

  const caps = track?.getCapabilities?.();
  if (!caps?.torch) {
    setStatus("Flash is not available on this camera.", "error");
    return;
  }

  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    torchButton.classList.toggle("torch-on", torchOn);
    setStatus(torchOn ? "Flash on." : "Flash off.", "success");
  } catch {
    torchOn = false;
    torchButton.classList.remove("torch-on");
    setStatus("Could not control flash.", "error");
  }
}

function rotateView() {
  if (!cameraOn) {
    setStatus("Start the camera first.", "error");
    return;
  }

  viewRotation = (viewRotation + 90) % 360;

  cameraCard.classList.remove("rot-90", "rot-180", "rot-270");
  if (viewRotation) cameraCard.classList.add("rot-" + viewRotation);

  rotButton.classList.toggle("active", viewRotation !== 0);
  setStatus("Camera view rotated " + viewRotation + "°.");
}

function startReminder() {
  stopReminder();

  reminder = setInterval(() => {
    if (!cameraOn || torchOn) return;

    if (Date.now() - lastGoodScan > 10000) {
      setStatus("No reads yet. Move closer, use ＋ zoom, or try ⚡ flash.", "warning");
    }
  }, 10000);
}

function stopReminder() {
  if (reminder) {
    clearInterval(reminder);
    reminder = null;
  }
}

async function startCamera(preferredId) {
  if (cameraOn) {
    stopCamera();
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("Camera is not supported in this browser.", "error");
    return;
  }

  setStatus("Requesting camera permission…");
  overlayEl.textContent = "Requesting camera permission…";
  overlayEl.classList.add("visible");

  const video = preferredId
    ? { deviceId: { exact: preferredId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    : { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } };

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    videoEl.srcObject = stream;
    await videoEl.play();

    cameraOn = true;
    deviceId = preferredId || deviceId;
    lastGoodScan = Date.now();

    overlayEl.classList.remove("visible");
    startButton.textContent = "Stop";
    startButton.classList.add("success");
    setStatus("Camera running. Aim the barcode at the green band.");

    setupControls();
    startReminder();
    startScanLoop();
  } catch (error) {
    cameraOn = false;
    startButton.textContent = "Start";
    startButton.classList.remove("success");
    overlayEl.textContent = "Camera unavailable";
    overlayEl.classList.add("visible");

    const message = String(error?.message || error).toLowerCase();

    if (message.includes("permission") || message.includes("denied") || message.includes("notallowed")) {
      setStatus("Camera permission denied.", "error");
    } else if (message.includes("notfound") || message.includes("no camera")) {
      setStatus("No camera available.", "error");
    } else {
      setStatus("Scanner failed: " + error.message, "error");
    }

    stream?.getTracks().forEach(t => t.stop());
    stream = null;
    track = null;
  }
}

function stopCamera() {
  if (!cameraOn) return;

  stopScanLoop();
  stopReminder();

  if (torchOn && track) {
    track.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
    torchOn = false;
    torchButton.classList.remove("torch-on");
  }

  stream?.getTracks().forEach(t => t.stop());

  stream = null;
  track = null;
  videoEl.srcObject = null;
  cameraOn = false;
  zoomCaps = null;
  zoom = 1;

  startButton.textContent = "Start";
  startButton.classList.remove("success");
  torchButton.disabled = true;
  cameraButton.disabled = true;
  updateZoomButtons();

  overlayEl.textContent = "Camera preview will appear here";
  overlayEl.classList.add("visible");
  setStatus("Camera stopped.");
}

async function switchCamera() {
  if (!cameraOn || devices.length < 2) return;

  const current = devices.findIndex(device => device.deviceId === deviceId);
  const next = devices[(current + 1) % devices.length];

  if (!next) return;

  stopCamera();
  startCamera(next.deviceId);
}

function freeze() {
  const source = grabFrame();
  if (!source) return;

  freezeEl.width = source.width;
  freezeEl.height = source.height;
  freezeEl.getContext("2d").drawImage(source, 0, 0);

  freezeEl.classList.add("visible");
  setTimeout(() => freezeEl.classList.remove("visible"), 550);
}

function playSound(sound) {
  if (!sound) return;

  try {
    sound.currentTime = 0;
    sound.play();
  } catch {}
}

function goodSound() {
  if (!goodAudio) goodAudio = new Audio("ding.mp3");
  playSound(goodAudio);
}

function badSound() {
  if (!badAudio) badAudio = new Audio("error.mp3");
  playSound(badAudio);
}

function vibrate(pattern) {
  navigator.vibrate?.(pattern);
}

function goodFlash() {
  flashEl.classList.remove("bad");
  flashEl.classList.add("active");
  setTimeout(() => flashEl.classList.remove("active"), 180);
}

function badFlash() {
  flashEl.classList.add("bad", "active");
  setTimeout(() => flashEl.classList.remove("active"), 350);
}

function assetCandidates(text) {
  if (!text) return [];

  const matches = text.match(/\b[A-Z]\d{5,8}\b/gi);
  if (!matches) return [];

  const valid = [];

  matches.forEach(match => {
    const clean = match.toUpperCase();

    if (!/^[A-Z]\d{5}$/.test(clean) && !/^R\d{8}$/.test(clean)) return;

    if (!valid.includes(clean)) valid.push(clean);

    if (/^R00[01]\d{5}$/.test(clean)) {
      const alternative = clean.slice(0, 3) + (clean.charAt(3) === "0" ? "1" : "0") + clean.slice(4);
      if (!valid.includes(alternative)) valid.push(alternative);
    }
  });

  return valid;
}

function showChoices(candidates) {
  choicesEl.innerHTML = "";
  choicesEl.classList.add("visible");

  candidates.forEach(candidate => {
    const button = document.createElement("button");
    button.className = "ocr-choice";
    button.type = "button";
    button.textContent = candidate;

    button.addEventListener("click", () => {
      manualEl.value = candidate;
      updateManualFormat();
      manualEl.focus();
      choicesEl.innerHTML = "";
      choicesEl.classList.remove("visible");
      setStatus("Selected " + candidate + ". Press Add.", "success");
    });

    choicesEl.appendChild(button);
  });
}

async function runOcr(image) {
  if (ocrBusy) return;

  if (!image || typeof Tesseract === "undefined") {
    setStatus("OCR is unavailable.", "error");
    return;
  }

  ocrBusy = true;
  ocrButton.disabled = true;
  ocrButton.textContent = "…";
  setStatus("Reading Asset ID…");

  try {
    if (!ocrWorker) {
      ocrWorker = await Tesseract.createWorker("eng", 1);
      await ocrWorker.setParameters({ tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" });
    }

    const result = await ocrWorker.recognize(image);
    const candidates = assetCandidates(result?.data?.text || "");

    if (!candidates.length) {
      setStatus("No Asset ID found. Try better light or a closer photo.", "error");
      return;
    }

    if (candidates.length === 1) {
      if (!addScan(candidates[0], "ocr")) {
        manualEl.value = candidates[0];
        updateManualFormat();
        manualEl.focus();
      }
      return;
    }

    showChoices(candidates);
    setStatus("Found " + candidates.length + " possible IDs. Tap one.", "success");
  } catch (error) {
    setStatus("OCR failed: " + (error?.message || "Unknown error"), "error");
  } finally {
    ocrBusy = false;
    ocrButton.disabled = true;
    ocrButton.textContent = "OCR";
    fileInput.value = "";
  }
}

function formatManualEntry(rawValue) {
  let value = String(rawValue || "").trim().toUpperCase();

  if (/^[A-Z]\d{5}$/.test(value) || /^R\d{8}$/.test(value)) {
    return value;
  }

  const digits = value.replace(/^R/, "").replace(/\D/g, "");

  if (!digits) return "";

  return "R" + digits.padStart(8, "0").slice(-8);
}

function updateManualFormat() {
  const formatted = formatManualEntry(manualEl.value);

  if (formatted && formatted !== manualEl.value) {
    manualEl.value = formatted;
    const caret = manualEl.value.length;
    manualEl.setSelectionRange(caret, caret);
  }
}

function addManual() {
  const value = formatManualEntry(manualEl.value);

  if (!value) {
    setStatus("Enter an Asset ID first.", "error");
    return;
  }

  manualEl.value = value;

  if (!/^[A-Z]\d{5}$/.test(value) && !/^R\d{8}$/.test(value)) {
    setStatus("Asset ID must be A12345 or R12345678.", "error");
    return;
  }

  if (addScan(value, "manual")) {
    manualEl.value = "";
    manualEl.blur();
  }
}

function exportTimestamp(date) {
  const pad = value => String(value).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) +
    "-" + pad(date.getHours()) + pad(date.getMinutes()) + pad(date.getSeconds());
}

function csvText() {
  return scans.map(scan => scan.barcode).join("\n") + (scans.length ? "\n" : "");
}

function downloadCsv(filename, content) {
  const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportCsv() {
  if (!scans.length) {
    setStatus("No scans to export.", "error");
    return;
  }

  const venue = venueEl.value.trim();
  const transfer = transferEl.value.trim();
  let name = "barcodes";

  if (venue) name += "-" + venue.replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "-");
  if (transfer) name += "-" + transfer.replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "-");

  const filename = name + "-" + exportTimestamp(new Date()) + ".csv";
  const content = csvText();

  if (navigator.share && navigator.canShare && window.File && window.Blob) {
    try {
      const file = new File([content], filename, { type: "text/csv" });
      const data = { title: "Barcode export", text: scans.length + " scanned barcode(s).", files: [file] };

      if (navigator.canShare(data)) {
        await navigator.share(data);
        setStatus("Shared " + filename, "success");
        return;
      }
    } catch (error) {
      if (error?.name === "AbortError") return;
      setStatus("Share failed. Downloading instead.", "error");
    }
  }

  downloadCsv(filename, content);
  setStatus("Downloaded " + filename, "success");
}

function clearScans() {
  if (!scans.length) return;
  if (!confirm("Clear all " + scans.length + " scans?")) return;

  scans = [];
  lastAction = null;
  lastScan = { text: null, time: 0 };

  saveScans();
  updateUi();
  setStatus("All scans cleared.");
}

function refreshPageCache() {
  const url = new URL(window.location.href);
  url.searchParams.set("cache", Date.now());
  window.location.replace(url.toString());
}

venueEl.value = meta.venue;
transferEl.value = meta.transfer;

venueEl.addEventListener("input", () => {
  meta.venue = venueEl.value;
  saveMetadata();
});

transferEl.addEventListener("input", () => {
  meta.transfer = transferEl.value;
  saveMetadata();
});

$("cacheButton").addEventListener("click", refreshPageCache);

startButton.addEventListener("click", () => startCamera());
cameraButton.addEventListener("click", switchCamera);
torchButton.addEventListener("click", toggleTorch);
guideButton.addEventListener("click", () => guideEl.classList.toggle("hidden"));
hardButton.addEventListener("click", forceScan);
rotButton.addEventListener("click", rotateView);
zoomInButton.addEventListener("click", () => setZoom(zoom + (zoomCaps?.step || 0.1)));
zoomOutButton.addEventListener("click", () => setZoom(zoom - (zoomCaps?.step || 0.1)));
videoEl.addEventListener("click", forceScan);

addButton.addEventListener("click", addManual);
manualEl.addEventListener("input", updateManualFormat);
manualEl.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    addManual();
  }
});

ocrButton.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  if (!file) return;

  const image = new Image();
  image.onload = () => runOcr(image);
  image.src = URL.createObjectURL(file);
});

confirmYes.addEventListener("click", () => closeConfirm(true));
confirmNo.addEventListener("click", () => closeConfirm(false));

undoButton.addEventListener("click", undo);
exportButton.addEventListener("click", exportCsv);
clearButton.addEventListener("click", clearScans);
searchEl.addEventListener("input", updateUi);

updateUi();
idbHydrate();
setStatus("Ready. Press Start to scan.");
</script>
</body>
</html>
