<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode Scanner CSV</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:-apple-system,sans-serif;background:#111;color:#fff;margin:0;padding:12px}.top{display:flex;gap:8px;margin:10px 0}button{flex:1;padding:14px;border:none;border-radius:10px}#reader{border-radius:12px;overflow:hidden}.count{font-size:32px;font-weight:bold;text-align:center;margin:10px 0}.status{text-align:center;color:#8f8}.scan{padding:4px;border-bottom:1px solid #333;word-break:break-all}</style></head><body><div class=count id=count>0</div><div class=status id=status>Starting...</div><div id=reader></div><div class=top><button onclick='exportCSV()'>Export CSV</button><button onclick='clearScans()'>Clear</button></div><div id=list></div><script>let scans=JSON.parse(localStorage.getItem('scans')||'[]');let last='',lastTime=0;function render(){count.textContent=scans.length;list.innerHTML=scans.slice().reverse().map(s=>`<div class=scan>${s}</div>`).join('')}render();function save(){localStorage.setItem('scans',JSON.stringify(scans))}function add(code){const n=Date.now();if(code===last&&n-lastTime<1500)return;last=code;lastTime=n;scans.push(code);save();render();status.textContent='Scanned: '+code;if(navigator.vibrate)navigator.vibrate(120);document.body.style.background='#063';setTimeout(()=>document.body.style.background='#111',120)}async function start(){try{const cams=await Html5Qrcode.getCameras();status.textContent='Cameras found: '+cams.length;const cam=cams[0];const scanner=new Html5Qrcode('reader');await scanner.start(cam.id,{fps:15,qrbox:{width:280,height:280}},add);status.textContent='Scanner running';}catch(e){status.textContent='Error: '+e.message;}}function exportCSV(){let csv='Barcode
'+scans.map(s=>'"'+s.replaceAll('"','""')+'"').join('
');const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='barcodes.csv';a.click()}function clearScans(){if(confirm('Clear all scans?')){scans=[];save();render()}}window.addEventListener('load',start);</script></body></html>
