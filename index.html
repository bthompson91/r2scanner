<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Scanner CSV</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:16px;background:#f2f2f7}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px}
button{width:100%;padding:14px;margin-top:8px;border:none;border-radius:10px;font-size:16px}
.start{background:#007aff;color:#fff}.export{background:#34c759;color:#fff}.clear{background:#ff3b30;color:#fff}
#reader{width:100%}.scan{padding:6px;border-bottom:1px solid #eee;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<h2>Barcode Scanner</h2>
<div id="reader"></div>
<button class="start" onclick="startScanning()">Start Scanner</button>
<button class="export" onclick="exportCSV()">Export CSV</button>
<button class="clear" onclick="clearScans()">Clear Scans</button>
<p>Status: <span id="status">Ready</span></p>
<p>Count: <span id="count">0</span></p>
</div>
<div class="card"><div id="scanList"></div></div>
<script>
const KEY='barcode_scans';
let scans=JSON.parse(localStorage.getItem(KEY)||'[]');
let scanner=null,last='',lastTime=0;
function save(){localStorage.setItem(KEY,JSON.stringify(scans));}
function render(){document.getElementById('count').textContent=scans.length;document.getElementById('scanList').innerHTML=scans.slice().reverse().map(x=>'<div class="scan">'+x+'</div>').join('');}
render();
function addScan(code){const now=Date.now();if(code===last&&now-lastTime<1500)return;last=code;lastTime=now;scans.push(code);save();render();document.getElementById('status').textContent=code;if(navigator.vibrate)navigator.vibrate(100);}
async function startScanning(){if(scanner)return;scanner=new Html5Qrcode('reader');try{const cams=await Html5Qrcode.getCameras();await scanner.start(cams[cams.length-1].id,{fps:10,qrbox:250},txt=>addScan(txt));document.getElementById('status').textContent='Scanner running';}catch(e){document.getElementById('status').textContent='Error: '+e.message;}}
function exportCSV(){let csv='Barcode
';scans.forEach(s=>csv+='"'+s.replaceAll('"','""')+'"
');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='barcodes.csv';a.click();}
function clearScans(){scans=[];save();render();document.getElementById('status').textContent='Cleared';}
</script>
</body></html>
