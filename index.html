<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode CSV Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font-family:-apple-system,sans-serif;background:#f2f2f7}#toolbar{position:sticky;top:0;background:#fff;padding:10px;display:flex;gap:8px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.1)}button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px}#start{background:#007aff;color:#fff}#export{background:#34c759;color:#fff}#clear{background:#ff3b30;color:#fff}.wrap{padding:12px}.count{font-size:28px;font-weight:700;margin:10px 0}#reader{overflow:hidden;border-radius:12px;background:#000}#status{margin:8px 0;color:#555}.scan{background:#fff;margin:4px 0;padding:10px;border-radius:8px;word-break:break-all}</style></head><body><div id="toolbar"><button id="start" onclick="startScanner()">Start Camera</button><button id="export" onclick="exportCSV()">Export CSV</button><button id="clear" onclick="clearScans()">Clear</button></div><div class="wrap"><div class="count">Scans: <span id="count">0</span></div><div id="status">Ready</div><div id="reader"></div><div id="list"></div></div><script>let scans=JSON.parse(localStorage.getItem('barcode_scans')||'[]');let scanner=null,last='',lastTime=0;function save(){localStorage.setItem('barcode_scans',JSON.stringify(scans));}function render(){count.textContent=scans.length;list.innerHTML=scans.slice().reverse().map(s=>'<div class="scan">'+s+'</div>').join('');}render();async function startScanner(){if(scanner)return;try{status.textContent='Starting camera...';const cams=await Html5Qrcode.getCameras();if(!cams.length)throw new Error('No camera found');const cam=cams[0];scanner=new Html5Qrcode('reader');await scanner.start(cam.id,{fps:15,qrbox:{width:280,height:280}},txt=>{const now=Date.now();if(txt===last&&now-lastTime<1500)return;last=txt;lastTime=now;scans.push(txt);save();render();status.textContent='Last scan: '+txt;if(navigator.vibrate)navigator.vibrate(100);});status.textContent='Scanner running';}catch(e){status.textContent='Error: '+e.message;}}function exportCSV(){let csv='Barcode
'+scans.map(x=>'"'+x.replaceAll('"','""')+'"').join('
');const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='barcodes.csv';a.click();}function clearScans(){if(confirm('Clear all scans?')){scans=[];save();render();}}</script></body></html>
