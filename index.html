<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Scanner CSV</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:-apple-system,sans-serif;background:#f2f2f7;padding:16px;margin:0}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px}
button{width:100%;padding:14px;margin:6px 0;font-size:16px}
#log{white-space:pre-wrap;font-family:monospace;background:#111;color:#0f0;padding:10px;border-radius:8px;max-height:240px;overflow:auto}
.scan{padding:4px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<div class="card">
<h2>Barcode Scanner</h2>
<button onclick="testLibrary()">Test Library</button>
<button onclick="testCamera()">Test Camera</button>
<button onclick="startScanner()">Start Scanner</button>
<button onclick="exportCsv()">Export CSV</button>
<div id="reader"></div>
</div>
<div class="card"><b>Count:</b> <span id="count">0</span><div id="scans"></div></div>
<div class="card"><div id="log"></div></div>
<script>
let scans=[];
function log(m){document.getElementById('log').textContent+=m+'\n';}
log('Page loaded');
function testLibrary(){log(typeof Html5Qrcode==='undefined'?'FAILED: Library not loaded':'SUCCESS: Library loaded');}
async function testCamera(){try{const s=await navigator.mediaDevices.getUserMedia({video:true});log('SUCCESS: Camera OK');s.getTracks().forEach(t=>t.stop());}catch(e){log('CAMERA ERROR: '+e.message);}}
async function startScanner(){try{const cameras=await Html5Qrcode.getCameras();log('Cameras: '+cameras.length);const scanner=new Html5Qrcode('reader');await scanner.start(cameras[cameras.length-1].id,{fps:10},txt=>{scans.push(txt);document.getElementById('count').textContent=scans.length;const d=document.createElement('div');d.className='scan';d.textContent=txt;document.getElementById('scans').prepend(d);});log('Scanner running');}catch(e){log('START ERROR: '+e.message);}}
function exportCsv(){let csv='Barcode\n';scans.forEach(s=>csv+='"'+s.replaceAll('"','""')+'"\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='barcodes.csv';a.click();}
</script>
</body>
</html>
