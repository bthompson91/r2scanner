function getTrack(){return stream?.getVideoTracks()?.[0]||null}async function setupControls(){track=getTrack();if(!track)return;try{await track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch{}let c=null;try{c=track.getCapabilities?.()||null}catch{}torchButton.disabled=!c?.torch;if(c?.zoom&&typeof c.zoom.min==="number"){zoomCaps={min:c.zoom.min,max:c.zoom.max,step:c.zoom.step||.1};zoom=zoomCaps.min}else{zoomCaps=null;zoom=1}updateZoomButtons();try{const all=await navigator.mediaDevices.enumerateDevices();devices=all.filter(d=>d.kind==="videoinput");const s=track.getSettings?.();if(s?.deviceId)deviceId=s.deviceId;cameraButton.disabled=devices.length<2}catch{devices=[];cameraButton.disabled=true}}function updateZoomButtons(){if(!zoomCaps){zoomInButton.disabled=true;zoomOutButton.disabled=true;zoomValue.textContent="";return}zoomOutButton.disabled=zoom<=zoomCaps.min+.001;zoomInButton.disabled=zoom>=zoomCaps.max-.001;zoomValue.textContent=zoom.toFixed(1)+"×"}async function setZoom(v){if(!track||!zoomCaps)return;const n=Math.min(zoomCaps.max,Math.max(zoomCaps.min,Number(v)));try{await track.applyConstraints({advanced:[{zoom:n}]});zoom=n;updateZoomButtons()}catch{setStatus("Zoom is not supported.","error")}}async function toggleTorch(){if(!cameraOn){setStatus("Start the camera first.","error");return}if(!track)track=getTrack();if(!track?.getCapabilities?.().torch){setStatus("Flash is not available.","error");return}try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});torchButton.classList.toggle("torch-on",torchOn)}catch{torchOn=false;torchButton.classList.remove("torch-on");setStatus("Could not control flash.","error")}}
function rotateView(){if(!cameraOn){setStatus("Start the camera first.","error");return}viewRotation=(viewRotation+90)%360;cameraCard.classList.remove("rot-90","rot-180","rot-270");if(viewRotation)cameraCard.classList.add("rot-"+viewRotation);rotButton.classList.toggle("active",viewRotation!==0);setStatus("Camera view rotated "+viewRotation+"°.")}function startReminder(){stopReminder();reminder=setInterval(()=>{if(cameraOn&&!torchOn&&Date.now()-lastGoodScan>10000)setStatus("No reads yet. Move closer, use ＋ zoom, or try ⚡ flash.","warning")},10000)}function stopReminder(){if(reminder){clearInterval(reminder);reminder=null}}
async function startCamera(preferred){if(cameraOn){stopCamera();return}if(!navigator.mediaDevices?.getUserMedia){setStatus("Camera is not supported in this browser.","error");return}setStatus("Requesting camera permission…");overlayEl.textContent="Requesting camera permission…";overlayEl.classList.add("visible");const video=preferred?{deviceId:{exact:preferred},width:{ideal:1920},height:{ideal:1080}}:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}};try{stream=await navigator.mediaDevices.getUserMedia({video,audio:false});videoEl.srcObject=stream;await videoEl.play();cameraOn=true;deviceId=preferred||deviceId;lastGoodScan=Date.now();overlayEl.classList.remove("visible");startButton.textContent="Stop";setStatus("Camera running. Reading all barcode and QR formats.");setupControls();startReminder();startScanLoop()}catch(e){cameraOn=false;startButton.textContent="Start";overlayEl.textContent="Camera unavailable";overlayEl.classList.add("visible");setStatus("Camera failed: "+(e.message||e),"error");stream?.getTracks().forEach(t=>t.stop());stream=null;track=null}}
function stopCamera(){if(!cameraOn)return;stopScanLoop();stopReminder();if(torchOn&&track)track.applyConstraints({advanced:[{torch:false}]}).catch(()=>{});torchOn=false;torchButton.classList.remove("torch-on");stream?.getTracks().forEach(t=>t.stop());stream=null;track=null;videoEl.srcObject=null;cameraOn=false;zoomCaps=null;zoom=1;startButton.textContent="Start";torchButton.disabled=true;cameraButton.disabled=true;updateZoomButtons();overlayEl.textContent="Camera preview will appear here";overlayEl.classList.add("visible");setStatus("Camera stopped.")}async function switchCamera(){if(!cameraOn||devices.length<2)return;const i=devices.findIndex(d=>d.deviceId===deviceId),next=devices[(i+1)%devices.length];stopCamera();startCamera(next.deviceId)}function freeze(){const c=grabFrame();if(!c)return;freezeEl.width=c.width;freezeEl.height=c.height;freezeEl.getContext("2d").drawImage(c,0,0);freezeEl.classList.add("visible");setTimeout(()=>freezeEl.classList.remove("visible"),550)}function playSound(a){if(!a)return;try{a.currentTime=0;a.play()}catch{}}function goodSound(){if(!goodAudio)goodAudio=new Audio("ding.mp3");playSound(goodAudio)}function badSound(){if(!badAudio)badAudio=new Audio("error.mp3");playSound(badAudio)}function vibrate(p){navigator.vibrate?.(p)}function goodFlash(){flashEl.classList.remove("bad");flashEl.classList.add("active");setTimeout(()=>flashEl.classList.remove("active"),180)}function badFlash(){flashEl.classList.add("bad","active");setTimeout(()=>flashEl.classList.remove("active"),350)}
function exportTimestamp(d){const p=v=>String(v).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}async function exportCsv(){if(!scans.length){setStatus("No scans to export.","error");return}let n="barcodes",v=venueEl.value.trim(),t=transferEl.value.trim();if(v)n+="-"+v.replace(/[^A-Z0-9]+/gi,"-");if(t)n+="-"+t.replace(/[^A-Z0-9]+/gi,"-");const fileName=n+"-"+exportTimestamp(new Date())+".csv",content=scans.map(s=>s.barcode).join("\n")+"\n";try{const f=new File([content],fileName,{type:"text/csv"}),data={title:"Barcode export",files:[f]};if(navigator.canShare?.(data)){await navigator.share(data);setStatus("Shared "+fileName,"success");return}}catch(e){if(e.name==="AbortError")return}const b=new Blob([content],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);setStatus("Downloaded "+fileName,"success")}function clearScans(){if(scans.length&&confirm("Clear all "+scans.length+" scans?")){scans=[];lastAction=null;saveScans();updateUi();setStatus("All scans cleared.")}}function refreshPageCache(){const u=new URL(location.href);u.searchParams.set("cache",Date.now());location.replace(u.toString())}
venueEl.value=meta.venue;transferEl.value=meta.transfer;venueEl.oninput=()=>{meta.venue=venueEl.value;saveMetadata()};transferEl.oninput=()=>{meta.transfer=transferEl.value;saveMetadata()};$("cacheButton").onclick=refreshPageCache;startButton.onclick=()=>startCamera();cameraButton.onclick=switchCamera;torchButton.onclick=toggleTorch;hardButton.onclick=forceScan;rotButton.onclick=rotateView;zoomInButton.onclick=()=>setZoom(zoom+(zoomCaps?.step||.1));zoomOutButton.onclick=()=>setZoom(zoom-(zoomCaps?.step||.1));videoEl.onclick=forceScan;addButton.onclick=addManual;manualEl.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addManual()}};confirmYes.onclick=()=>closeConfirm(true);confirmNo.onclick=()=>closeConfirm(false);undoButton.onclick=undo;exportButton.onclick=exportCsv;clearButton.onclick=clearScans;searchEl.oninput=updateUi;updateUi();idbHydrate();setStatus("Ready. Press Start to scan.");
